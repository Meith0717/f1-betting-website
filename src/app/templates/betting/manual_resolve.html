{% extends 'base.html' %}
{% import '_icons.html' as icons %}
{% block content %}

<div class="container">
  {% set back_url = url_for('betting.betting_dashboard') %}
  {% set title = 'Manual Resolve: ' ~ race_id %}
  {% set icon = 'target' %}
  {% include '_page_header.html' %}

  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Enter Race Results</h2>
    </div>
    <div class="card-content">
      <form method="POST" action="{{ url_for('betting.manual_resolve_race', race_id=race_id) }}">
        <div class="form-group">
          <label for="position_1">1st Place</label>
          <select id="position_1" name="position_1" class="form-control" required>
            <option value="" disabled selected>Select driver...</option>
            {% for driver in drivers %}
            <option value="{{ driver.driver_id }}">#{{ driver.number }} - {{ driver.name }} ({{ driver.team }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="position_2">2nd Place</label>
          <select id="position_2" name="position_2" class="form-control" required>
            <option value="" disabled selected>Select driver...</option>
            {% for driver in drivers %}
            <option value="{{ driver.driver_id }}">#{{ driver.number }} - {{ driver.name }} ({{ driver.team }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="position_3">3rd Place</label>
          <select id="position_3" name="position_3" class="form-control" required>
            <option value="" disabled selected>Select driver...</option>
            {% for driver in drivers %}
            <option value="{{ driver.driver_id }}">#{{ driver.number }} - {{ driver.name }} ({{ driver.team }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="fastest_lap">Fastest Lap</label>
          <select id="fastest_lap" name="fastest_lap" class="form-control" required>
            <option value="" disabled selected>Select driver...</option>
            {% for driver in drivers %}
            <option value="{{ driver.driver_id }}">#{{ driver.number }} - {{ driver.name }} ({{ driver.team }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Resolve Race</button>
          <a href="{{ url_for('betting.betting_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
