{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>{% if current_user.email %}📧 Change{% else %}✉️ Set{% endif %} Email Address</h1>
        
        <form method="POST" action="{{ url_for('main.change_email') }}" class="auth-form">
            <div class="form-group">
                <label for="current_password">Current Password (for verification)</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            
            <div class="form-group">
                <label for="new_email">New Email Address</label>
                <input type="email" id="new_email" name="new_email" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_email">Confirm Email Address</label>
                <input type="email" id="confirm_email" name="confirm_email" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-submit">{% if current_user.email %}Change{% else %}Set{% endif %} Email</button>
                <a href="{{ url_for('main.profile') }}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
