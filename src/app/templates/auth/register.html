{% extends 'base.html' %} {% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h1>🏎️ Create F1 Betting Account</h1>

    <form
      method="POST"
      action="{{ url_for('auth.register') }}"
      class="auth-form"
    >
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>

      {% if require_registration_password %}
      <div class="form-group">
        <label for="registration_password">Registration Password</label>
        <input
          type="password"
          id="registration_password"
          name="registration_password"
          required
        />
        <p class="form-hint">🔐 Required for account creation</p>
      </div>
      {% endif %}

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="{{ url_for('auth.login') }}">Login here</a>
    </div>
  </div>
</div>
{% endblock %}
