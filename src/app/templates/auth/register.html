{% extends 'base.html' %} {% block content %}

<div class="auth-container">
  <div class="card auth-card">
    <h1>👤 Create Account</h1>

    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          placeholder="Choose a username"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          placeholder="Create a password"
          class="form-control"
        />
      </div>

      {% if require_registration_password %}
      <div class="form-group">
        <label for="registration_password">Registration Password</label>
        <input
          type="password"
          id="registration_password"
          name="registration_password"
          required
          placeholder="Enter registration password"
          class="form-control"
        />
        <p class="form-hint">Required for account creation</p>
      </div>
      {% endif %}

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div class="auth-footer mt-4">
      <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
    </div>
  </div>
</div>

{% endblock %}
