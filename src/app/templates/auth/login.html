{% extends 'base.html' %} {% block content %}

<div class="auth-container">
  <div class="card auth-card">
    <div class="auth-header">
      <h1 class="auth-title">🔑 Sign In</h1>
      <p class="auth-subtitle">Welcome back! Please sign in to continue</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          placeholder="Your username"
          autocomplete="username"
          class="form-control mobile-input"
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          placeholder="Your password"
          autocomplete="current-password"
          class="form-control mobile-input"
        />
        <p class="form-hint mobile-hint">
          <span class="hint-icon">ℹ️</span> Forgot your password? Contact an administrator
        </p>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-large">
        <span class="btn-icon">🔓</span> Sign In
      </button>
    </form>

    <div class="auth-footer">
      <p class="auth-footer-text">Don't have an account? 
        <a href="{{ url_for('auth.register') }}" class="auth-link">
          <span class="link-icon">👤</span> Create one
        </a>
      </p>
    </div>
  </div>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='css/auth-styles.css') }}" />

{% endblock %}
