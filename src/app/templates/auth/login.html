{% extends 'base.html' %} {% block content %}

<div class="auth-container">
  <div class="card auth-card">
    <h1>🔑 Sign In</h1>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          placeholder="Your username"
          autocomplete="username"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          placeholder="Your password"
          autocomplete="current-password"
          class="form-control"
        />
        <p class="form-hint">Forgot your password? Contact an administrator for assistance</p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="auth-footer mt-4">
      <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
    </div>
  </div>
</div>

{% endblock %}
