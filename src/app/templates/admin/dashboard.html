{% extends 'base.html' %}

{% block content %}
<h1>Admin Dashboard</h1>

<p><a href="{{ url_for('admin.manage_users') }}">Manage Users</a></p>

<h3>System Statistics</h3>
<p>Total users: {{ users|length }}</p>
<p>Admin users: {{ users|selectattr('is_admin')|list|length }}</p>
<p>Regular users: {{ users|rejectattr('is_admin')|list|length }}</p>

<h3>Quick Actions</h3>
<p><a href="{{ url_for('admin.manage_users') }}">Manage Users</a></p>
{% endblock %}
