{% extends 'base.html' %}
{% import '_icons.html' as icons %} {% block content %}

<div class="container">
  <div class="page-header">
    <a href="{{ url_for('admin.admin_dashboard') }}" class="back-button">{{ icons.icon('back') }}</a>
    <h1 class="page-title">{{ icons.icon('target') }} Resolve Race (Manual)</h1>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Enter Race Results</h2>
    </div>
    <div class="card-content">
      <form method="POST" action="{{ url_for('admin.resolve_race') }}">
        <div class="form-group">
          <label for="race_id">Race</label>
          <select id="race_id" name="race_id" class="form-control" required>
            <option value="" disabled selected>Select race...</option>
            {% for race in races %}
            <option value="{{ race.id }}">{{ race.name }} ({{ race.country }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="driver_1">1st Place</label>
          <select id="driver_1" name="driver_1" class="form-control" required>
            <option value="" disabled selected>Select driver...</option>
            {% for driver in drivers %}
            <option value="{{ driver.driver_id }}">#{{ driver.number }} - {{ driver.name }} ({{ driver.team }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="driver_2">2nd Place</label>
          <select id="driver_2" name="driver_2" class="form-control" required>
            <option value="" disabled selected>Select driver...</option>
            {% for driver in drivers %}
            <option value="{{ driver.driver_id }}">#{{ driver.number }} - {{ driver.name }} ({{ driver.team }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="driver_3">3rd Place</label>
          <select id="driver_3" name="driver_3" class="form-control" required>
            <option value="" disabled selected>Select driver...</option>
            {% for driver in drivers %}
            <option value="{{ driver.driver_id }}">#{{ driver.number }} - {{ driver.name }} ({{ driver.team }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="fastest_lap">Fastest Lap (optional)</label>
          <select id="fastest_lap" name="fastest_lap" class="form-control">
            <option value="">— None —</option>
            {% for driver in drivers %}
            <option value="{{ driver.driver_id }}">#{{ driver.number }} - {{ driver.name }} ({{ driver.team }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Resolve Race</button>
          <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>


{% endblock %}
