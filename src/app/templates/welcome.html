{% extends 'base.html' %} {% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/auth-styles.css') }}" />

<div class="welcome-container">
  <div class="welcome-content">
    <div class="welcome-logo">
      <img src="{{ url_for('static', filename='icons/icon-192x192.png') }}" alt="F1 Betting logo" class="logo-icon" width="56" height="56" />
      <h1 class="welcome-title">F1 Betting</h1>
    </div>

    <div class="card welcome-card">
      <p class="welcome-description">
        Welcome to the ultimate Formula 1 betting experience! Sign in or create an account to start betting on races.
      </p>

      <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            placeholder="Your username"
            autocomplete="username"
            class="form-control mobile-input"
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Your password"
            autocomplete="current-password"
            class="form-control mobile-input"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-large">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        <p class="auth-footer-text">Don't have an account?
          <a href="{{ url_for('auth.register') }}" class="auth-link">Create one</a>
        </p>
      </div>
    </div>
  </div>
</div>

{% endblock %}
