{% extends 'base.html' %} {% block content %}

<div class="welcome-container">
  <div class="welcome-content">
    <div class="welcome-logo">
      <span class="logo-icon">🏎️</span>
      <h1 class="welcome-title">F1 Betting</h1>
    </div>
    
    <div class="welcome-card">
      <p class="welcome-description">
        Welcome to the ultimate Formula 1 betting experience! Sign in or create an account to start betting on races.
      </p>

      <div class="auth-actions">
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-block btn-large" title="Sign in to your existing account">
          🔑 Sign In
        </a>
        <a href="{{ url_for('auth.register') }}" class="btn btn-secondary btn-block btn-large" title="Create a new account to start betting">
          👤 Create Account
        </a>
      </div>
    </div>
  </div>
</div>

<style>
  /* Mobile-first welcome page styles */
  .welcome-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
  }

  .welcome-content {
    width: 100%;
    max-width: 500px;
    text-align: center;
  }

  .welcome-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .logo-icon {
    font-size: 48px;
  }

  .welcome-title {
    font-size: 32px;
    font-weight: 700;
    margin: 0;
    color: var(--primary);
  }

  .welcome-card {
    background-color: var(--surface);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    margin-top: 24px;
  }

  .welcome-description {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .auth-actions {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .btn-large {
    padding: 16px 24px;
    font-size: 16px;
    font-weight: 600;
  }

  @media (min-width: 480px) {
    .auth-actions {
      flex-direction: row;
    }

    .auth-actions .btn {
      flex: 1;
    }
  }
</style>

<script src="{{ url_for('static', filename='js/countdown.js') }}"></script>

{% endblock %}
