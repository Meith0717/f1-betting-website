services:
  f1-betting:
    build: .
    container_name: f1-betting
    ports:
      - "8080:8080"
    volumes:
      - f1-data:/app/src/app/data
      - f1-instance:/app/src/instance
    env_file:
      # VAPID keys, SECRET_KEY, REGISTRATION_PASSWORD — copy .env.example to .env
      # and fill it in (build.sh / app/generate_vapid_keys.py generate the VAPID keys)
      - .env
    environment:
      # Anything set here overrides .env
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    restart: unless-stopped

volumes:
  f1-data:
  f1-instance:
